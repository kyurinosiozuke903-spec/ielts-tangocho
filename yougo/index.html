<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>📗 用語・事例 – 設問2ドリル</title>
<style>
  :root {
    --bg: #f2f4f3;
    --card-bg: #ffffff;
    --accent: #0f766e;
    --accent-light: #d7efec;
    --accent-dark: #115e59;
    --text: #16211f;
    --text-muted: #6b7280;
    --border: #e3e6e5;
    --warn: #b45309;
    --danger: #dc2626;
    --shadow: 0 4px 24px rgba(0,0,0,0.07);
    --radius: 16px;
    --tr: 0.22s ease;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    padding-bottom: calc(68px + var(--safe-bottom));
    font-size: 15px; line-height: 1.7;
  }
  button, textarea, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ─── Header ─── */
  .header {
    background: var(--card-bg); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo { font-size: 20px; }
  .header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.01em; }
  .header-sub { font-size: 11px; color: var(--text-muted); }
  .header-right { display: flex; gap: 6px; }
  .btn-icon {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; cursor: pointer; font-size: 13px; color: var(--text-muted);
    display: flex; align-items: center; gap: 5px; transition: var(--tr); white-space: nowrap;
  }
  .btn-icon:active { background: var(--accent-light); color: var(--accent-dark); border-color: var(--accent); }

  /* ─── Countdown strip ─── */
  .exam-strip {
    background: var(--accent-dark); color: #d7efec; text-align: center;
    font-size: 11.5px; padding: 5px 12px; letter-spacing: 0.03em;
  }

  /* ─── Bottom Nav ─── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card-bg); border-top: 1px solid var(--border);
    display: flex; z-index: 200; padding-bottom: var(--safe-bottom);
    box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 10px 0 6px; gap: 3px; background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 10px; font-weight: 600; transition: var(--tr);
  }
  .nav-item.active { color: var(--accent); }
  .nav-item .nav-icon { font-size: 19px; }

  /* ─── Layout ─── */
  .app-body { max-width: 700px; margin: 0 auto; padding: 14px 12px; }
  .view { display: none; } .view.active { display: block; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 16px; margin-bottom: 12px;
  }
  .muted { color: var(--text-muted); font-size: 12.5px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* ─── Chips / meta ─── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border);
    font-size: 12px; font-weight: 600; cursor: pointer; transition: var(--tr);
    background: transparent; color: var(--text-muted);
  }
  .chip.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
  .tag {
    display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 11px;
    font-weight: 700; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border);
  }
  .tag.kind-用語 { background: var(--accent-light); color: var(--accent-dark); border-color: #a7d9d3; }
  .tag.kind-事例 { background: #fdeee0; color: #9a4a06; border-color: #f3d6bb; }
  .tag.asked { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }

  /* ─── Rotation ─── */
  .rot-progress { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .term-name {
    font-family: var(--serif); font-size: 27px; font-weight: 600; line-height: 1.35;
    margin: 10px 0 4px; letter-spacing: 0.01em;
  }
  .prompt-hint {
    font-size: 12px; color: var(--text-muted); border-left: 3px solid var(--accent-light);
    padding-left: 10px; margin: 12px 0 8px;
  }
  textarea.answer {
    width: 100%; min-height: 130px; padding: 12px 13px; border: 1.5px solid var(--border);
    border-radius: 12px; font-size: 15px; line-height: 1.8; resize: vertical;
    background: #fbfcfc; color: var(--text); outline: none;
  }
  textarea.answer:focus { border-color: var(--accent); background: #fff; }
  .meter { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .meter .over { color: var(--warn); font-weight: 700; }
  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 12px; background: var(--accent);
    color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; transition: var(--tr);
  }
  .btn:active { background: var(--accent-dark); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent-dark); border: 1.5px solid var(--accent); }
  .btn.small { padding: 9px; font-size: 13px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }

  .answer-panel { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .answer-label { font-size: 11px; font-weight: 700; color: var(--accent-dark); letter-spacing: 0.08em; margin-bottom: 6px; }
  .answer-body { font-size: 15px; line-height: 1.85; }
  .answer-sub { margin-top: 10px; font-size: 13.5px; color: var(--text-muted); }
  .answer-sub b { color: var(--text); }
  .prev-answer {
    margin-top: 12px; padding: 10px 12px; background: var(--bg); border-radius: 10px;
    font-size: 13.5px; line-height: 1.75; white-space: pre-wrap; color: var(--text-muted);
  }
  .grade-row { display: flex; gap: 6px; margin-top: 14px; }
  .grade-btn {
    flex: 1; padding: 10px 4px; border-radius: 10px; border: 1.5px solid var(--border);
    background: #fff; font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--text-muted);
  }
  .grade-btn.g0 { border-color: #fecaca; color: #b91c1c; }
  .grade-btn.g1 { border-color: #fde3b3; color: #a16207; }
  .grade-btn.g2 { border-color: #fef08a; color: #854d0e; }
  .grade-btn.g3 { border-color: #bbf7d0; color: #15803d; }

  /* ─── Mock exam ─── */
  .timer {
    font-size: 34px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em; margin: 4px 0 2px;
  }
  .timer.low { color: var(--danger); }
  .pick-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border: 1.5px solid var(--border);
    border-radius: 12px; margin-bottom: 8px; cursor: pointer; transition: var(--tr); background: #fff;
  }
  .pick-item.picked { border-color: var(--accent); background: var(--accent-light); }
  .pick-item .num { font-size: 12px; font-weight: 700; color: var(--text-muted); min-width: 16px; }
  .pick-name { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .mock-q { margin-bottom: 16px; }
  .mock-q .q-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .mock-q .q-no { font-size: 12px; font-weight: 700; color: var(--accent); }
  .score-row { display: flex; gap: 6px; margin-top: 8px; }
  .score-btn {
    flex: 1; padding: 8px 0; border-radius: 9px; border: 1.5px solid var(--border);
    background: #fff; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
  }
  .score-btn.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark); }
  .total {
    text-align: center; font-size: 22px; font-weight: 700; margin: 6px 0;
    font-variant-numeric: tabular-nums;
  }

  /* ─── List / stats ─── */
  .search {
    width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 14px; outline: none; background: #fff; margin-bottom: 10px;
  }
  .search:focus { border-color: var(--accent); }
  .list-item { padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .list-item:last-child { border-bottom: none; }
  .list-name { font-family: var(--serif); font-size: 16.5px; font-weight: 600; }
  .list-desc { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .list-desc.clamp { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
  .stat-label { width: 84px; color: var(--text-muted); }
  .stat-track { flex: 1; height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width 0.5s ease; }
  .stat-count { width: 52px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fill-苦手 { background: #ef4444; } .fill-うろ覚え { background: #f59e0b; }
  .fill-ほぼ覚えた { background: #eab308; } .fill-覚えた { background: #10b981; }

  /* ─── Drawer ─── */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card-bg); border-radius: 20px 20px 0 0;
    padding: 18px 16px calc(24px + var(--safe-bottom));
    z-index: 301; transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 85vh; overflow-y: auto;
  }
  .drawer-overlay.open .drawer { transform: translateY(0); }
  .drawer-handle { width: 36px; height: 4px; background: #d1d5db; border-radius: 2px; margin: 0 auto 16px; }
  .drawer-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .filter-group { margin-bottom: 16px; }
  .filter-label { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 7px; letter-spacing: 0.06em; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
  .empty { text-align: center; padding: 40px 16px; color: var(--text-muted); font-size: 14px; }
  .hidden-file-input { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="header-logo">📗</span>
    <div>
      <div class="header-title">用語・事例</div>
      <div class="header-sub" id="header-sub">読み込み中…</div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-icon" onclick="openDrawer()">⚙️ 絞込</button>
    <button class="btn-icon" onclick="exportProgress()">⬇︎</button>
    <button class="btn-icon" onclick="document.getElementById('import-file').click()">⬆︎</button>
    <input type="file" id="import-file" class="hidden-file-input" accept=".json,application/json" onchange="importProgress(event)">
  </div>
</div>
<div class="exam-strip" id="exam-strip"></div>

<div class="app-body">

  <!-- ══ 回転 ══ -->
  <section class="view active" id="view-rotate">
    <div class="card" id="rot-card"></div>
  </section>

  <!-- ══ 模試 ══ -->
  <section class="view" id="view-mock">
    <div id="mock-area"></div>
  </section>

  <!-- ══ 一覧 ══ -->
  <section class="view" id="view-list">
    <div class="card" id="stats-card"></div>
    <div class="card">
      <input class="search" id="search" placeholder="用語・説明を検索" oninput="renderList()">
      <div id="list-area"></div>
    </div>
  </section>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-view="rotate" onclick="switchView('rotate')"><span class="nav-icon">🔁</span>回転</button>
  <button class="nav-item" data-view="mock" onclick="switchView('mock')"><span class="nav-icon">📝</span>模試</button>
  <button class="nav-item" data-view="list" onclick="switchView('list')"><span class="nav-icon">📚</span>一覧</button>
</nav>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer(event)">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-handle"></div>
    <div class="drawer-title">絞り込み</div>
    <div class="filter-group"><div class="filter-label">種別</div><div class="chips" id="f-kind"></div></div>
    <div class="filter-group"><div class="filter-label">出自</div><div class="chips" id="f-source"></div></div>
    <div class="filter-group" id="cluster-group"><div class="filter-label">クラスタ</div><div class="chips" id="f-cluster"></div></div>
    <div class="filter-group"><div class="filter-label">習熟度</div><div class="chips" id="f-prof"></div></div>
    <div class="filter-group">
      <div class="switch-row">
        <div>
          <div style="font-size:14px;font-weight:600">既出語を除く</div>
          <div class="muted">過去問（24・25・26）で出題済みの語を隠す</div>
        </div>
        <div class="chips"><button class="chip" id="f-asked" onclick="toggleAsked()">除かない</button></div>
      </div>
    </div>
    <button class="btn" onclick="closeDrawer()">閉じる</button>
  </div>
</div>

  { 名前:"オーディエンス・コスト", 説明:"指導者が対外的に威嚇・約束した後に後退すると、国内世論から政治的代償を払うこと。民主国はこのコストにより威嚇の信憑性が高まるとされる。デモクラティック・ピースの合理主義的説明にも接続。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ジェームズ・フィアロン（1994年）", 年代:"1994年", 事例:"", 既出:false },

  { 名前:"グローバル・ガバナンス", 説明:"世界政府が存在しない中で、国家・国際機構・NGO・企業など多様な主体が問題領域ごとに秩序を形成・管理する営み。事例：気候変動レジーム、SDGs、インターネット・ガバナンス。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ローズノー「政府なき統治（Governance without Government）」（1992年）", 年代:"1992年", 事例:"", 既出:false },
  { 名前:"グローバル・コンパクト（難民GCR／移住GCM）", 説明:"難民に関するグローバル・コンパクト（GCR）と安全で秩序ある正規移住のためのグローバル・コンパクト（GCM）。いずれも2018年採択の法的拘束力のない国家主導枠組みで、責任分担の制度化を目指すが実効性に課題。米国はGCM交渉から離脱。ソフト・ローの典型例。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ニューヨーク宣言（2016年）→国連で採択（2018年）", 年代:"2018年", 事例:"", 既出:false },
  { 名前:"グローバル・バリューチェーン（GVC）", 説明:"製品の企画・生産・販売が国境を跨いで分業される生産構造。付加価値は上流（研究開発）と下流（ブランド・サービス）に偏る（スマイルカーブ）。貿易統計の総額ではなく付加価値で測る必要性や、サプライチェーン強靄化の文脈で重要。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ゲレフィらのGVC研究、2000年代に普及", 年代:"2000年代〜", 事例:"", 既出:false },
  { 名前:"グローバル・ミニマム課税", 説明:"多国籍企業に対する実効税率15%の最低課税を導入し、税の底辺への競争（race to the bottom）を抑制する国際合意。国家間協調による税ガバナンスの画期とされる。事例：OECD/G20包摂的枠組み（BEPS）で約140か国が合意（2021年）。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"OECD/G20 BEPS包摂的枠組み（2021年合意）", 年代:"2021年", 事例:"", 既出:false },
  { 名前:"コストリー・シグナリング", 説明:"安価な口先ではなくコストのかかる行動で意図の真剣さを伝達すること。退路を断つtying hands（オーディエンス・コスト型）と事前に費用を投じるsinking costs（軍隊動員等）に区別される。事例：同盟国への駐留軍配備（介入の人質）。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"フィアロン（1997年）", 年代:"1997年", 事例:"", 既出:false },
  { 名前:"コミットメント問題", 説明:"将来の力関係の変化により、現在の合意を将来も守ると信憑性をもって約束できないために協力・和平が崩れる問題。予防戦争や内戦和平の失敗（武装解除後の再弾圧恐怖）の主因とされる。事例：内戦和平合意の保証問題と第三者保証の役割。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"フィアロン（1995年）", 年代:"1995年", 事例:"", 既出:false },
  { 名前:"コンストラクティビズム", 説明:"国家利益・アイデンティティ・脅威認識は物質能力だけで決まらず、規範・理念・相互作用によって社会的に構成されるとみる国際関係理論。オナフ、ウェントらが代表。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"オナフが用語化（1989年）、ウェント「アナーキーは国家が作るもの」（1992年）", 年代:"1989年／1992年", 事例:"", 既出:true },
  { 名前:"コンディショナリティ", 説明:"IMF・世銀の融資に付される政策条件（緊縮財政・構造改革等）。内政干渉性や受益国のオーナーシップとの緊張が批判されてきた。事例：アジア通貨危機（1997年）での対韓・対インドネシア融資条件への反発。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"IMF構造調整プログラム（1980年代〜）", 年代:"1980年代〜", 事例:"", 既出:false },
  { 名前:"シーレーン", 説明:"貿易品、エネルギー、軍事物資などを運ぶ主要な海上交通路。ホルムズ海峡やマラッカ海峡などのチョークポイントの安全確保は国家の経済・安全保障に直結する。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"思想的起源はマハン『海上権力史論』（1890年）のシーパワー論", 年代:"1890年〜", 事例:"", 既出:true },
  { 名前:"スパイラル・モデル", 説明:"人権規範が抑圧→否認→戦術的譲歩→規範の地位獲得→規範適合行動の5段階を経て国内に定着するとするモデル。ブーメラン効果の反復・螺旋的作動を定式化。事例：東欧・南アフリカの人権規範受容。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"リッセ・ロップ・シッキンク編『The Power of Human Rights』（1999年）", 年代:"1999年", 事例:"", 既出:false },
  { 名前:"ソフトパワー／シャープパワー", 説明:"ソフトパワーは強制や報酬ではなく文化・価値・政策の魅力により相手の選好を形成する力（ナイ）。シャープパワーは権威主義国が情報操作・威圧で他国世論に介入する力（NED、2017年）。事例：ハリウッド・K-POP対孔子学院・偽情報工作。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ジョセフ・ナイ（1990年）／全米民主主義基金（NED、2017年）", 年代:"1990年／2017年", 事例:"", 既出:false },
  { 名前:"ソフト・ロー／ハード・ロー（法化）", 説明:"国際的約束を義務の強さ・精確性・第三者への委任の3次元で捉え、拘束力の弱いソフト・ローが主権コストの低さ・柔軟性で選択される機能を分析する枠組み。事例：グローバル・コンパクト、パリ協定の義務・非義務の混合設計。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"アボット＆スナイダル（2000年、International Organization誌の法化特集）", 年代:"2000年", 事例:"", 既出:false },
  { 名前:"チキン・ゲーム", 説明:"双方が強硬策を取れば破滅的衝突に至るため、相手の譲歩を期待して強硬策を競うゲーム構造。先に退路を断った側が有利になる（コミットメントの逆説）。瀬戸際政策の基礎。事例：キューバ危機（1962年）。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"シェリングの戦略論で定式化", 年代:"1960年代（キューバ危機1962年）", 事例:"", 既出:false },
  { 名前:"デカップリング／デリスキング", 説明:"対立国との経済的相互依存を全面的に切り離す（デカップリング）か、重要分野に限定して依存リスクを低減する（デリスキング）かという対中経済戦略の対比。事例：G7広島サミット（2023年）でデリスキングが公式化。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"フォン・デアライエン欧州委員長演説→G7広島サミット（2023年）", 年代:"2023年", 事例:"", 既出:false },
  { 名前:"デモクラティック・ピース", 説明:"成熟した民主国家同士は戦争をしにくいという命題。制度的制約と、妥協・非暴力を重視する規範の共有から説明する。思想的起源はカント、現代の実証研究はマイケル・ドイルなど。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"カント『永遠平和のために』（1795年）。実証研究はマイケル・ドイル（1983年）", 年代:"1795年／実証化1983年", 事例:"", 既出:true },
  { 名前:"トゥキディデスの罠", 説明:"台頭国の勃興が既存覇権国に恐怖を生み、権力移行期に戦争が起こりやすくなるという構図。「アテナイの台頭とそれがスパルタに与えた恐怖」が原型で、アリソンが米中関係に適用した。意図の不確実性から生じる安全保障のジレンマ（ハーツ1950）とは別概念であり、併記・混同しない。", 種別:"用語", 出自:"25", クラスタ:"", 提唱者:"グレアム・アリソン『Destined for War（米中戦争前夜）』（2017）。トゥキュディデス『戦史』の分析に由来", 年代:"2017（原型は前5世紀）", 事例:"", 既出:true },
  { 名前:"トランスナショナル・アドボカシー・ネットワーク（TAN）", 説明:"価値を共有するNGO・活動家・国際機構職員等の国境を越えた網。情報の政治・象徴の政治・レバレッジの政治・アカウンタビリティの政治という4戦術で国家行動を変える。事例：対人地雷禁止キャンペーン、人権アドボカシー。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ケック＆シッキンク（1998年）", 年代:"1998年", 事例:"", 既出:false },
  { 名前:"ネオリベラル制度論", 説明:"覇権国が衰退しても、国際制度が取引費用の削減・情報提供・将来の影（反復取引の期待）を通じて国家間協力を維持できるとする理論。覇権安定論への反論。事例：米覇権衰退後も存続したGATT/WTO体制。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ロバート・コヘイン『覇権後（After Hegemony）』（1984年）", 年代:"1984年", 事例:"", 既出:false },
  { 名前:"ノン・ルフールマン原則", 説明:"難民・庇護希望者を迫害のおそれのある領域に送還してはならないとする難民保護の根幹原則（1951年難民条約33条）。慣習国際法化の議論がある一方、侵食が進む。事例：米国の第三国送還、豪の域外処理。卒論の規範衰退分析の中核事例候補。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"1951年難民条約第33条", 年代:"1951年", 事例:"", 既出:false },
  { 名前:"ハイブリッド戦争・グレーゾーン事態", 説明:"正規戦・非正規戦・サイバー攻撃・偽情報などを組み合わせ、武力攻撃と認定しにくい閾値以下で現状変更を図る手法。抑止と対処の制度的空白を突く。事例：ロシアのクリミア併合（2014年）、認知戦、海上民兵によるグレーゾーン活動。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"クリミア併合（2014年）以降に概念が普及。ゲラシモフ論文と関連づけて論じられる", 年代:"2014年〜", 事例:"", 既出:false },
  { 名前:"バンドワゴニング", 説明:"脅威に対抗（バランシング）せず、強者・脅威の側に便乗すること。シュウェラーは安全のためだけでなく利益獲得のための便乗もあると指摘。事例：小国の対大国追従外交。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ウォルツ（1979年）、シュウェラー「Bandwagoning for Profit」（1994年）", 年代:"1979年／1994年", 事例:"", 既出:false },
  { 名前:"パブリック・ディプロマシー", 説明:"政府が他国の一般市民・世論に直接働きかけて自国のイメージ・政策への理解を促進する外交。ソフトパワーの実践手段。事例：孔子学院をめぐるシャープパワー論争、クールジャパン。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"冷戦期の広報外交に源流、2000年代に再注目", 年代:"2000年代〜", 事例:"", 既出:false },
  { 名前:"ビジネスと人権に関する指導原則", 説明:"企業活動と人権に関する国際基準。国家の保護義務・企業の尊重責任（人権デューデリジェンス）・救済へのアクセスの3本柱。法的拘束力のないソフト・ローだが、各国の人権DD義務化立法に波及。事例：ウイグル強制労働問題とサプライチェーン規制。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ラギー（国連事務総長特別代表）が策定、人権理事会承認（2011年）", 年代:"2011年", 事例:"", 既出:false },
  { 名前:"フォーカル・ポイント", 説明:"コミュニケーションができない状況でも、目立つ自然な解に期待が収斂する調整ゲームの解。事例：境界線としての河川・38度線、核使用・不使用の閾値という暗黙の焦点。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"シェリング『紛争の戦略』（1960年）", 年代:"1960年", 事例:"", 既出:false },
  { 名前:"フォーラム・ショッピング／レジーム・シフティング", 説明:"複数の制度が並存する中で、行為主体が自らに有利なフォーラムを選んで争点を持ち込む（ショッピング）、あるいは交渉の場自体を別の制度に移す（シフティング）戦略。レジーム・コンプレックスの帰結。事例：知的財産権（WIPO→TRIPS）、難民保護。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ヘルファー（2004年、レジーム・シフティング概念）", 年代:"2004年", 事例:"", 既出:false },
  { 名前:"フレンドショアリング", 説明:"サプライチェーンを価値観を共有する友好国・同盟国に移転・集中させる経済安全保障政策。効率性より信頼性を優先するグローバリゼーション再編の一形態。事例：イエレン米財務長官の提唱（2022年）、半導体サプライチェーンの再編。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"イエレン米財務長官の演説（2022年）で普及", 年代:"2022年〜", 事例:"", 既出:false },
  { 名前:"ブーメラン・モデル", 説明:"国内で抑圧された市民社会団体が国境を越えて海外のNGO・国家・国際機構に情報を流し、外から自国政府に圧力をかけてもらう構図。事例：ラテンアメリカの人権NGOが米欧経由で軍事政権に圧力。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ケック＆シッキンク『Activists beyond Borders』（1998年）", 年代:"1998年", 事例:"", 既出:false },
  { 名前:"プリンシパル＝エージェント理論と国際機構", 説明:"加盟国（本人）が国際機構（代理人）に権限を委任し、監視コストや選好の乖離から代理人が裁量を拡大する（エージェンシー・スラック）構図で国際機構の自律性と統制を分析する枠組み。事例：IMF・世銀への委任と加盟国による統制。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ホーキンスら編『Delegation and Agency in International Organizations』（2006年）", 年代:"2006年", 事例:"", 既出:false },
  { 名前:"ヘッジング", 説明:"大国間対立の下で、対抗（バランシング）と関与（エンゲージメント）の要素を組み合わせ、どちらの陣営にも完全には賭けずリスクを分散する戦略。事例：東南アジア諸国の米中間での対中戦略。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"東南アジア研究（クイック・チェンチー（Cheng-Chwee Kuik）ら）で精緻化", 年代:"2000年代〜", 事例:"", 既出:false },
  { 名前:"マルチステークホルダー・ガバナンス", 説明:"政府だけでなく企業・市民社会・学術界などの利害関係者が対等に意思決定に参加する統治様式。国家間主義の限界を補う一方、代表性・責任の所在が課題。事例：ICANNのインターネット管理、SDGs策定過程、グローバル・コンパクト。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"2000年代のインターネット・持続可能開発ガバナンスで制度化", 年代:"2000年代〜", 事例:"", 既出:false },
  { 名前:"ミニラテラリズム", 説明:"少数の有志国による軽量で機動的な協力枠組み。普遍的多国間主義の停滞への対応として拡大。制度化の軽さと引き換えに正統性・包摂性が課題。事例：QUAD、AUKUS、日米韓キャンプ・デーヴィッド合意（2023年）。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"2010年代以降のインド太平洋戦略環境で発展", 年代:"2010年代〜", 事例:"", 既出:false },
  { 名前:"モラルハザード（人道的介入と反乱誘発）", 説明:"保障・救済の存在が被保障者のリスクテイクを誘発する問題。人道的介入やR2Pの期待が反政府勢力の武装蜂起を誘発しうるとクーパーマンが指摘（介入の逆説）。事例：コソボ解放軍・リビア反体制派の事例分析。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"クーパーマンの人道的介入研究", 年代:"2000年代", 事例:"", 既出:false },
  { 名前:"リベラル国際秩序とその動揺", 説明:"米国主導の開放的・ルール基盤型の国際秩序（自由貿易・多国間主義・民主主義）と、新興国の台頭・ポピュリズム・米国自身の離反（トランプ政権）によるその動揺をめぐる議論。事例：相互関税、WTO機能不全、同盟軽視。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"アイケンベリー『Liberal Leviathan』（2011年）・「The End of Liberal International Order?」（2018年）", 年代:"2011／2018年", 事例:"", 既出:false },
  { 名前:"リベラル政府間主義", 説明:"欧州統合は超国家機関の自律的発展ではなく、国内経済利益に基づく加盟国政府間の交渉と合理的選択の結果だとする理論。新機能主義への対抗理論。事例：マーストリヒト条約交渉の分析。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"アンドリュー・モラヴチック『The Choice for Europe』（1998年）", 年代:"1998年", 事例:"", 既出:false },
  { 名前:"レジーム・コンプレックス", 説明:"単一の包括的レジームではなく、部分的に重なり合い階層性のない複数の制度の集合体が一つの争点領域を統治する状態。フォーラム選択や規則の矛盾を生む。事例：難民保護（Betts 2010）、気候変動、遺伝資源。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ラウスティアラ＆ヴィクター（2004年）、アルター＆ムニエ（2009年）", 年代:"2004年／2009年", 事例:"", 既出:false },
  { 名前:"ローカリゼーション", 説明:"現地の行為主体が外来規範を既存の地域規範・信念体系に適合するよう再構成して受容する過程。規範はそのまま伝播するのではなく現地化される。事例：ASEANにおける協調的安全保障規範の受容と不介入原則の維持。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"アミターブ・アチャリア（2004年）", 年代:"2004年", 事例:"", 既出:false },
  { 名前:"ワシントン・コンセンサス", 説明:"財政健全化・貿易自由化・民営化など、IMF・世銀・米財務省が途上国に推奨した新自由主義的経済政策パッケージの総称。国家主導の「北京コンセンサス」と対比される。事例：ラテンアメリカ構造調整の失敗と反発。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ジョン・ウィリアムソン（1989年）が命名", 年代:"1989年", 事例:"", 既出:false },
  { 名前:"世界経済の政治的トリレンマ", 説明:"ハイパーグローバリゼーション・国家主権・民主主義の3つは同時には成立せず、2つしか選べないとする議論。反グローバリズム・ポピュリズム分析の定番枠組み。事例：Brexit、トランプ関税政策。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ダニ・ロドリック『グローバリゼーション・パラドックス』（2011年）", 年代:"2011年", 事例:"", 既出:false },
  { 名前:"世界貿易機関（WTO）", 説明:"1995年1月1日に設立された国際機関。GATTを基礎に、物品・サービス・知的財産を含む貿易ルールの運用、交渉、紛争解決を担う。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"ウルグアイ・ラウンド合意に基づくマラケシュ協定（1994年署名）", 年代:"1995年設立", 事例:"", 既出:true },
  { 名前:"主権国家体制（ウェストファリア体制）", 説明:"対内的に排他的な統治権、対外的に法的平等と内政不干渉を備えた主権国家を国際社会の基本単位とする体制。三十年戦争の講和に起源を求める通説には歴史学からの修正論もあるが、答案では人権・介入・グローバルガバナンス論の出発点として使う。人権保障の一義的責任が国家にあることの根拠。", 種別:"用語", 出自:"25", クラスタ:"", 提唱者:"ウェストファリア条約（1648）", 年代:"1648", 事例:"", 既出:true },
  { 名前:"予防外交", 説明:"紛争の発生・拡大を未然に防ぐための外交活動（早期警報、信頼醸成、予防展開等）。事例：マケドニアへの国連予防展開（UNPREDEP）。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ブトロス・ガリ『平和への課題』（1992年）", 年代:"1992年", 事例:"", 既出:false },
  { 名前:"予防戦争／先制攻撃の区別", 説明:"先制攻撃は差し迫った攻撃に対する対応、予防戦争は将来の力関係の悪化を見越した攻撃。予防戦争は国際法上正当化が困難。事例：イラク戦争（2003年）とブッシュ・ドクトリン。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ブッシュ・ドクトリン（2002年国家安全保障戦略）で争点化", 年代:"2003年（イラク戦争）", 事例:"", 既出:false },
  { 名前:"二層ゲーム", 説明:"国際交渉は、交渉相手との国際レベル（第一層）と国内の批准取り付け（第二層）の同時ゲームであり、合意は双方のウィンセット（国内批准可能な合意の集合）の重なりでのみ成立するとする分析枠組み。事例：日米貿易交渉。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ロバート・パットナム（1988年）", 年代:"1988年", 事例:"", 既出:false },
  { 名前:"人道原則（人道・公平・中立・独立）", 説明:"人道支援の4原則。人道（苦痛の軽減）・公平（ニーズのみに基づく配分）・中立（敵対行為に加担しない）・独立（政治・軍事目的からの自律）。ICRCに起源し、国連総会決議46/182（1991年）等で確認。人道支援の政治化・安保化との緊張が論点。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ICRCの基本原則→国連総会決議46/182（1991年）", 年代:"1991年", 事例:"", 既出:false },
  { 名前:"人道的介入", 説明:"大規模人権侵害を止めるための、安保理授権を欠く武力介入。主権・内政不干渉原則との緊張が核心で、R2Pとの異同（R2Pは安保理授権を前提）が論点。事例：NATOのコソボ空爆（1999年）は「違法だが正当」と評された。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"コソボ空爆（1999年）をめぐる論争で焦点化（コソボ独立国際委員会報告）", 年代:"1999年", 事例:"", 既出:false },
  { 名前:"人間の安全保障", 説明:"国家ではなく一人ひとりの人間を安全保障の単位とし、「恐怖からの自由」と「欠乏からの自由」を確保するという概念。紛争・貧困・感染症・環境破壊など国家単位の安全保障では対処できない脅威に対応する。日本は外交の柱として推進。事例：国連人間の安全保障基金を通じた紛争後コミュニティ再建や保健・教育支援。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"UNDP『人間開発報告書』（1994年）で提唱。緒方貞子・アマルティア・セン共同議長の人間の安全保障委員会報告書（2003年）で発展", 年代:"1994年／2003年", 事例:"", 既出:true },
  { 名前:"保護する責任（R2P）", 説明:"国家が自国民をジェノサイド・戦争犯罪・民族浄化・人道に対する罪から保護できない／しない場合、国際社会が保護の責任を負うとする規範。主権を「責任としての主権」と再定義。事例：リビア介入（2011年）と、その後のシリア不介入との対比。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ICISS報告書（2001年）→国連世界サミット成果文書138・139項（2005年）", 年代:"2001年／2005年", 事例:"", 既出:false },
  { 名前:"共有地の悲劇", 説明:"非排他的だが競合的な共有資源は、各利用者の合理的な利用拡大によって過剰利用され枯渇する。国際関係では公海漁業や大気（気候変動）が例。非競合・非排他の公共財（サミュエルソン1954）とは資源の性質が異なる。反論としてオストロム（1990）の自主的管理の研究がある。", 種別:"用語", 出自:"25", クラスタ:"", 提唱者:"ギャレット・ハーディン、Science誌論文 \"The Tragedy of the Commons\"（1968）", 年代:"1968", 事例:"", 既出:true },
  { 名前:"共通だが差異ある責任（CBDR）", 説明:"地球環境問題への対処責任はすべての国が共有するが、問題への歴史的寄与と対処能力の差に応じて先進国がより重い責任を負うとする原則。京都議定書（1997）の先進国限定の削減義務に体現され、パリ協定（2015）では全員参加型（自国決定貢献）へ修正された。今回の設問2の選択肢だったが未選択。次回書けるように準備する。", 種別:"用語", 出自:"25", クラスタ:"", 提唱者:"リオ宣言第7原則・気候変動枠組条約3条1項（1992）", 年代:"1992", 事例:"", 既出:true },
  { 名前:"内政不干渉原則", 説明:"国家の国内管轄事項への他国・国際機構の介入を禁じる基本原則。人権保障の国際化（人道的介入、R2P、普遍的定期審査）と恒常的な緊張関係にあり、設問1(1)の「帰結」を論じる際の軸になる。新疆ウイグル自治区への対応が非難・制裁にとどまる構造の説明に使える。", 種別:"用語", 出自:"25", クラスタ:"", 提唱者:"国連憲章2条7項（1945）。ウェストファリア条約（1648）以来の主権概念に淵源", 年代:"1648／1945", 事例:"", 既出:true },
  { 名前:"制度の合理的設計", 説明:"国際制度の設計（加盟資格・範囲・集権化・柔軟性等）は、協力問題の性質（執行問題・分配問題・不確実性）に対する国家の合理的選択の結果だとする研究プログラム。事例：エスケープ条項や柔軟性条項の設計分析。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"コレモノス・リプソン・スナイダル「The Rational Design of International Institutions」（2001年）", 年代:"2001年", 事例:"", 既出:false },
  { 名前:"勢力均衡（内的／外的バランシング）", 説明:"台頭する国力に対し、軍備増強（内的バランシング）や同盟形成（外的バランシング）で対抗し、いずれかの国による支配を防ぐ行動・状態。アナーキーの帰結として反復的に生じる。事例：対中国での日米豪印の連携。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ケネス・ウォルツ『国際政治の理論』（1979年）が理論化", 年代:"1979年", 事例:"", 既出:false },
  { 名前:"協調的安全保障", 説明:"特定の仮想敵を定めず、潜在的な対立国も含めた包摂的枠組みで、透明性向上・信頼醸成措置・対話を通じて武力紛争の発生自体を予防する安全保障構想。例はOSCE（1995改組）とASEAN地域フォーラム（1994）。違反国への集団的強制を軸とする集団安全保障とは区別する。今回の設問2の選択肢だったが未選択。", 種別:"用語", 出自:"25", クラスタ:"", 提唱者:"パルメ委員会報告『共通の安全保障』（1982）の系譜。冷戦後にOSCE・ARFで制度化", 年代:"1980〜90年代", 事例:"", 既出:true },
  { 名前:"南南協力・新興ドナー", 説明:"途上国・新興国間の開発協力と、OECD開発援助委員会（DAC）に属さない援助供与国（中国・インド・湾岸諸国等）の台頭。内政不干渉・相互利益を掲げ、DAC型援助レジームの規範（条件付け・透明性）を相対化。事例：一帯一路、インドの周辺国援助。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"バンドン会議（1955年）に源流、2000年代に再活性化", 年代:"2000年代〜", 事例:"", 既出:false },
  { 名前:"同盟のジレンマ", 説明:"同盟国が「見捨てられ（abandonment）」と「巻き込まれ（entrapment）」という二つのリスクの間で直面する緊張。同盟へのコミットメントを強めると同盟国の紛争に巻き込まれる危険が高まり、弱めると危機の際に見捨てられる危険が高まるというトレードオフ。事例：日米同盟で日本は台湾有事への巻き込まれと米国の関与低下による見捨てられの双方を懸念してきた。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"グレン・スナイダー「同盟政治における安全保障のジレンマ」（1984年）", 年代:"1984年", 事例:"", 既出:true },
  { 名前:"囚人のジレンマと協調の進化", 説明:"各主体が裏切りを支配戦略とするため協力が実現しないゲーム構造。アクセルロッドは反復ゲームでは応報戦略（tit-for-tat）と将来の影により協調が進化しうることを示した。事例：軍拡競争、貿易自由化の相互主義。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"アクセルロッド『つきあいの科学』（1984年）", 年代:"1984年", 事例:"", 既出:false },
  { 名前:"国内避難民（IDP）と指導原則", 説明:"紛争・災害等で国境を越えずに避難した人々。難民条約の保護対象外で、国内避難に関する指導原則（1998年、デング事務総長特別代表）がソフト・ローとして保護基準を提示。人数は難民を大きく上回る。事例：ウクライナ・スーダンのIDP。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"国内避難に関する指導原則（1998年、デング）", 年代:"1998年", 事例:"", 既出:false },
  { 名前:"国際レジーム", 説明:"特定の争点領域において行為主体の期待が収斂する「原則・規範・ルール・意思決定手続の集合」（クラズナーのコンセンサス定義は暗記必須）。事例：NPT体制、GATT/WTO体制、難民レジーム。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"スティーヴン・クラズナー編『International Regimes』（1983年）", 年代:"1983年", 事例:"", 既出:false },
  { 名前:"国際公共財", 説明:"非競合性・非排他性を備え、便益が国境を越えて及ぶ財・サービス。例は自由貿易体制、基軸通貨、航行の自由、安定した安全保障環境。非排他性ゆえにフリーライダー問題が生じて過少供給になりやすく、キンドルバーガーは1930年代の大不況を覇権国による供給の欠如として説明した（覇権安定論の基礎）。ハーディン（共有地の悲劇）は競合的な共有資源の議論であり、公共財の論者として書かない。", 種別:"用語", 出自:"25", クラスタ:"", 提唱者:"ポール・サミュエルソン「公共支出の純粋理論」（1954）＋チャールズ・キンドルバーガー『大不況下の世界 1929-1939』（1973）", 年代:"1954／1973", 事例:"", 既出:true },
  { 名前:"国際機構による社会化", 説明:"国際機構への参加を通じて、国家やその代表が説得・模倣・役割学習により規範・アイデンティティを内面化する過程。単なる制度による制約ではなく選好自体の変化に注目。事例：ASEAN地域フォーラムでの中国外交官の社会化（ジョンストン）、EU加盟交渉。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"チェッケル（2005年、IO誌特集）、ジョンストン（2001年）", 年代:"2001／2005年", 事例:"", 既出:false },
  { 名前:"国際機構の官僚制的自律性と病理", 説明:"国際機構は加盟国の道具ではなく、専門知識と規則に基づく権威を持つ官僚制として自律的に行動し、目的の転移やルールの自己目的化といった病理も生むとする議論。事例：UNHCRの帰還推進の失敗、ルワンダ虐殺時の国連事務局。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"バーネット＆フィネモア『Rules for the World』（2004年）", 年代:"2004年", 事例:"", 既出:false },
  { 名前:"国際金融のトリレンマ（不可能な三位一体）", 説明:"為替相場の安定・自由な資本移動・金融政策の自律性の3つは同時に達成できず、2つしか選べないとする命題。事例：ブレトンウッズ体制（資本規制を選択）と変動相場制への移行、ユーロ危機。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"マンデル＝フレミング・モデルに由来", 年代:"1960年代", 事例:"", 既出:false },
  { 名前:"地位（ステータス）と国際政治", 説明:"国家は物質的利益だけでなく国際的地位・承認を追求し、地位への不満が対外強硬策を導くとする議論（地位追求の戦略：移動・競争・創造）。事例：ロシア・中国の地位不満と修正主義的行動の説明。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ラーソン＆シェブチェンコの地位研究", 年代:"2010年代〜", 事例:"", 既出:false },
  { 名前:"地域安全保障複合体", 説明:"安全保障上の相互依存が地理的に集中し、脅威認識と安全保障力学が地域単位でまとまりを持つ集合。グローバルな分析と国家単位の分析の中間レベル。事例：南アジア、中東、東アジアの各複合体。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ブザン＆ウェーバー『Regions and Powers』（2003年）", 年代:"2003年", 事例:"", 既出:false },
  { 名前:"地経学（geoeconomics）", 説明:"地政学的目的を軍事ではなく経済的手段（通商・投資・金融・技術）で追求する国家行動とその分析視角。事例：一帯一路、相互関税、半導体をめぐる米中競争。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ルトワック（1990年）、ブラックウィル＆ハリス『War by Other Means』（2016年）", 年代:"1990年／2016年", 事例:"", 既出:false },
  { 名前:"埋め込まれた自由主義", 説明:"戦後ブレトンウッズ体制は、多角的自由貿易と国内の雇用・福祉補償を組み合わせた妥協（社会に埋め込まれた市場）だったとする概念。新自由主義への転換による「埋め込み」の解体がポピュリズムの背景とされる。相互関税・反グローバリズムの分析に接続可。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ジョン・ラギー（1982年）。ポランニーの「埋め込み」概念に由来", 年代:"1982年", 事例:"", 既出:false },
  { 名前:"基軸通貨と「法外な特権」", 説明:"ドルが基軸通貨であることで米国は低コストで対外赤字をファイナンスでき、金融制裁のインフラ（ドル決済網）も握るという非対称的優位。事例：対ロシア・イラン金融制裁、脱ドル化（BRICS）の議論。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"「法外な特権」はジスカール・デスタン（仏蔵相、1960年代）の言", 年代:"1960年代〜", 事例:"", 既出:false },
  { 名前:"多角主義", 説明:"多数国が共通のルールと制度の下で貿易交渉・紛争処理を行う原則。国別の力関係だけでなく、一般化された行動原則に基づく。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"GATT体制で制度化（1947年）。概念の理論化はジョン・ラギー（1992年）", 年代:"1947年／理論化1992年", 事例:"", 既出:true },
  { 名前:"存在論的安全保障", 説明:"国家は物理的安全だけでなく、自己アイデンティティの一貫性（存在論的安全）を追求し、そのために紛争的な関係・ルーティーンに固執することさえあるとする議論。事例：ロシアの対西洋アイデンティティ語りとウクライナ侵攻の分析。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ミッツェン（2006年）", 年代:"2006年", 事例:"", 既出:false },
  { 名前:"安全保障のジレンマ", 説明:"自国の安全を高めるための軍備増強が、意図に関わらず他国の不安を高めて対抗措置を招き、結果として双方の安全が低下する構造。アナーキー下での意図の不確実性が原因。事例：東アジアの軍拡競争、意図の読めない軍近代化。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ジョン・ハーツ（1950年）、ジャーヴィス「安全保障のジレンマ下の協調」（1978年）", 年代:"1950年／1978年", 事例:"", 既出:false },
  { 名前:"安全保障化", 説明:"安全保障問題は客観的に存在するのではなく、発話行為によって「存立に関わる脅威」と提示され聴衆に受容されることで構築されるとする理論。通常政治を超えた例外措置を正当化する。事例：移民・感染症（コロナ）・気候変動の安全保障化。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ブザン＆ウェーバーらコペンハーゲン学派『Security: A New Framework for Analysis』（1998年）", 年代:"1998年", 事例:"", 既出:false },
  { 名前:"安定・不安定パラドックス", 説明:"相互核抑止により全面戦争のリスクが下がる（戦略レベルの安定）ほど、低烈度の紛争や限定的挑発がかえって起きやすくなる（戦術レベルの不安定）という逆説。事例：印パ紛争（カルギル紛争）、ロシアの「核の影」の下でのウクライナ侵攻。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"グレン・スナイダー（1965年）", 年代:"1965年", 事例:"", 既出:false },
  { 名前:"安心供与（reassurance）", 説明:"抑止の威嚇と併せて、相手が自制すれば攻撃しないと信じさせる働きかけ。威嚇一辺倒はスパイラルを招くため、抑止の成立には不可欠とされる。同盟国への安心供与（見捨てられ懸念の緩和）の文脈でも用いる。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ジャーヴィス以降の抑止・スパイラル理論で発展", 年代:"冷戦期〜", 事例:"", 既出:false },
  { 名前:"対抗多国間主義（contested multilateralism）", 説明:"既存制度に不満を持つ国が、別の制度を新設・強化して既存制度に挑戦する現象（レジーム・シフティング型と競合制度創設型）。事例：AIIBの創設、BRICS拡大、新開発銀行。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"モース＆コヘイン（2014年）", 年代:"2014年", 事例:"", 既出:false },
  { 名前:"庇護の外部化", 説明:"先進国が国境管理・庇護審査を域外・第三国に移転し、庇護希望者の到達自体を阻止する政策群。ノン・ルフールマンの実質的空洞化として批判される。事例：EU・トルコ合意（2016年）、豪のパシフィック・ソリューション、英ルワンダ計画。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"フィッツジェラルド『Refuge beyond Reach』（2019年）、ラベネックス", 年代:"2010年代〜", 事例:"", 既出:false },
  { 名前:"従属論・世界システム論", 説明:"途上国の低開発は先進国との交易構造による搾取の帰結だとする従属論と、資本主義世界経済を中心・半周辺・周辺の階層構造として捉える世界システム論。リベラルな相互利益論への根本的批判。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"プレビッシュ、フランク、ウォーラーステイン『近代世界システム』（1974年）", 年代:"1960〜70年代", 事例:"", 既出:false },
  { 名前:"恐怖の均衡", 説明:"米ソ双方が第二撃能力（先制核攻撃を受けても壊滅的報復を行える能力）を持つことで、核戦争への恐怖そのものが開戦を抑止する状態。均衡の基礎は兵力の配分ではなく報復の確実性で、相互確証破壊（MAD）として戦略化された。第二撃能力が脆弱になると崩れる「デリケートな」均衡。例はキューバ危機（1962）以後の米ソ関係、ホットライン、SALT。脅威均衡論（ウォルト1987、同盟形成の理論）との取り違えに注意（今回0点の原因）。", 種別:"用語", 出自:"25", クラスタ:"", 提唱者:"アルバート・ウォルステッター「The Delicate Balance of Terror」（1959）。「恐怖の均衡」の語はレスター・ピアソン国連演説（1955）が初出とされる", 年代:"1950年代後半", 事例:"", 既出:true },
  { 名前:"恒久的三解決策", 説明:"難民問題の恒久的解決とされる自発的帰還・庇護国での現地統合・第三国定住の3つ。いずれも供給不足で、難民の長期化（protracted situations）が常態化している。事例：第三国定住の供給は必要数の数％にとどまる。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"UNHCR規程（1950年）に基づく", 年代:"1950年〜", 事例:"", 既出:false },
  { 名前:"戦争の合理主義的説明", 説明:"戦争は交渉より非効率なのになぜ起きるかを、(1)私的情報と誇示誘因、(2)コミットメント問題、(3)争点の不可分性の3つのメカニズムで説明する枠組み。合理主義的戦争研究の基本文献。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"フィアロン「Rationalist Explanations for War」（1995年）", 年代:"1995年", 事例:"", 既出:false },
  { 名前:"戦略的曖昧性", 説明:"防衛義務の有無や介入の条件を意図的に曖昧にし、相手の冒険（中国の侵攻）と味方の暴走（台湾の独立宣言）の双方を抑止する政策。事例：米国の台湾政策（台湾関係法）と「曖昧性終焉」論争。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"台湾関係法（1979年）以降の米国の対台政策", 年代:"1979年〜", 事例:"", 既出:false },
  { 名前:"抑止と強要（compellence）", 説明:"抑止は相手に行動を「起こさせない」ための威嚇、強要は相手に現状変更の行動を「取らせる」ための威嚇。強要は相手の面子を潰し譲歩が可視化されるため成功しにくい。事例：対北朝鮮の非核化要求、経済制裁による行動変更要求。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"トーマス・シェリング『軍備と影響力』（1966年）", 年代:"1966年", 事例:"", 既出:false },
  { 名前:"拒否的抑止／懲罰的抑止", 説明:"拒否的抑止は攻撃を物理的に成功させない能力（ミサイル防衛・防衛力整備）で断念させ、懲罰的抑止は耐え難い報復（核報復等）の威嚇で思いとどまらせる。事例：日本のミサイル防衛と反撃能力の議論。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"グレン・スナイダー『抑止と防衛』（1961年）", 年代:"1961年", 事例:"", 既出:false },
  { 名前:"拡大抑止と核の傘", 説明:"自国への攻撃だけでなく同盟国への攻撃にも報復すると誓約して抑止する戦略。同盟国のために本当に核を使うのかという信憑性問題が核心で、見捨てられ懸念と直結。事例：米韓核協議グループ（NCG）、NATOの核共有。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"冷戦期の米同盟政策で発展。信憑性問題はシェリングの抑止理論と接続", 年代:"冷戦期〜", 事例:"", 既出:false },
  { 名前:"攻撃・防御バランス", 説明:"攻撃と防御のどちらが軍事的に優位か、また攻撃用・防御用の兵力が識別可能かにより、安全保障のジレンマの深刻さと戦争の起きやすさが変わるとする議論。攻撃優位・識別不能のとき最も危険。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ロバート・ジャーヴィス（1978年）", 年代:"1978年", 事例:"", 既出:false },
  { 名前:"攻撃的／防御的リアリズム", 説明:"攻撃的リアリズムは、アナーキー下で生存を確保するには地域覇権を目指すしかないとする（ミアシャイマー）。防御的リアリズムは、国家は現状維持的に安全を追求し、過剰拡張は自滅を招くとする（ウォルツ、ジャーヴィス）。事例：対中評価の分岐。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ミアシャイマー『大国政治の悲劇』（2001年）／ウォルツ・ジャーヴィス", 年代:"2001年", 事例:"", 既出:false },
  { 名前:"文明の衝突論と批判", 説明:"冷戦後の紛争はイデオロギーではなく文明間（西欧・イスラム・中華等）の断層線で生じるとする議論。文明を固定的・均質的に扱う本質主義としてセンらが批判。事例：9.11後の「対テロ戦争」言説での援用と批判。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ハンチントン（Foreign Affairs、1993年）", 年代:"1993年", 事例:"", 既出:false },
  { 名前:"新機能主義とスピルオーバー", 説明:"特定分野の統合が隣接分野の統合必要性を生み（スピルオーバー）、忠誠心が超国家機関へ移行して統合が深化するとする地域統合理論。事例：石炭鉄鋼共同体→EEC→EUの発展と、Brexitという逆流。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"エルンスト・ハース『The Uniting of Europe』（1958年）", 年代:"1958年", 事例:"", 既出:false },
  { 名前:"核のタブー", 説明:"核兵器の使用を道徳的に許されないものとする強固な国際規範。抑止（合理的計算）だけでなく規範的禁忌が広島・長崎以降80年の不使用を支えてきたとする構成主義的議論。ロシアの核威嚇による侵食が現在の論点。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"タンネンワルド『The Nuclear Taboo』（2007年）", 年代:"2007年", 事例:"", 既出:false },
  { 名前:"核兵器禁止条約（TPNW）", 説明:"核兵器の開発・保有・使用・威嚇等を包括的に禁止する初の条約。核保有国と核の傘の下の国（日本含む）は不参加で、NPTとの補完性・緊張関係が論点。核のスティグマ化という規範的効果が狙い。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ICAN等の推進で国連で採択（2017年）", 年代:"2017年採択・2021年発効", 事例:"", 既出:false },
  { 名前:"権力移行論", 説明:"国際システムの安定は支配国の優位に依存し、台頭国が支配国に迫る権力移行期に、現状に不満を持つ台頭国との戦争リスクが最大化するとする理論。覇権安定論（公共財供給の議論）との区別が重要。事例：米中対立（アリソンの「トゥキュディデスの罠」）。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"オルガンスキー（1958年）、アリソン（2017年）", 年代:"1958年／2017年", 事例:"", 既出:false },
  { 名前:"武器化された相互依存", 説明:"金融・情報などのグローバル・ネットワークのハブを採る国（主に米国）が、その中心性を監視（panopticon）や遮断（chokepoint）の武器として利用できるとする議論。相互依存＝平和という想定を覆す。事例：SWIFTからのロシア排除（2022年）、対中半導体規制。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ファレル＆ニューマン「Weaponized Interdependence」（2019年）", 年代:"2019年", 事例:"", 既出:false },
  { 名前:"歴史の終わり", 説明:"冷戦終結により自由民主主義がイデオロギー闘争の最終的勝者となったとする議論。権威主義の再興・ポピュリズムの台頭を受け、2020年代に再評価・批判の対象に。リベラル国際秩序の動揺と対で論じられる。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"フランシス・フクヤマ（1989年論文、1992年著書）", 年代:"1989年", 事例:"", 既出:false },
  { 名前:"気候変動と人の移動", 説明:"海面上昇・干ばつ・災害による移動・避難。現行難民条約は「気候難民」を保護対象としないが、テイティオタ事件（自由権規約委員会、2020年）は生命への脅威があれば送還が人権法違反となりうると示唆。保護ギャップが主要論点。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"テイティオタ対ニュージーランド事件（2020年）", 年代:"2020年", 事例:"", 既出:false },
  { 名前:"混合移動（mixed migration）", 説明:"難民と経済移民が同じ経路・手段で移動し、動機も迫害・貧困・家族再統合など複合的である現象。難民／移民の二分法に基づく保護体制の限界を示す。事例：地中海ルート・中米キャラバン。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"UNHCR・IOMの政策議論で概念化", 年代:"2000年代〜", 事例:"", 既出:false },
  { 名前:"瀬戸際政策", 説明:"危機をあえてエスカレートさせ、共有されたリスクを操作して相手に譲歩を迫る戦略。チキン・ゲームの論理に基づく。事例：北朝鮮の核・ミサイル危機、キューバ危機。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"シェリングのリスク操作論（『紛争の戦略』1960年）", 年代:"冷戦期", 事例:"", 既出:false },
  { 名前:"無差別原則", 説明:"WTO体制の原則。加盟国間を差別しない最恵国待遇と、輸入品を国内品より不利に扱わない内国民待遇から成る。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"GATT第1条（最恵国待遇）・第3条（内国民待遇）", 年代:"1947年", 事例:"", 既出:true },
  { 名前:"相互核抑止", 説明:"敵の先制核攻撃を受けても報復できる第二撃能力を双方が保持し、耐え難い損害への恐れから核攻撃を思いとどまる状態。相互確証破壊（MAD）が代表的な形。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"ブローディー『絶対兵器』（1946年）、シェリングの抑止理論（1960年代）", 年代:"1946年〜冷戦期", 事例:"", 既出:true },
  { 名前:"相互関税", 説明:"貿易相手国ごとに異なる関税率を設定し、相手国の関税・非関税措置などを理由に自国側の関税を引き上げる政策。WTOの最恵国待遇や多角的交渉との緊張を生む。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"第2次トランプ政権が大統領令で導入", 年代:"2025年", 事例:"", 既出:true },

  { 名前:"私的権威とプライベート・ガバナンス", 説明:"国家以外の主体（企業・NGO・業界団体）がルール形成・基準設定の権威を行使する現象。事例：格付会社（ムーディーズ・S&P）の国債格付け、森林認証（FSC）、ISO規格。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ホール＆ビアステーカー編（2002年）", 年代:"2002年", 事例:"", 既出:false },
  { 名前:"経済制裁の有効性論争", 説明:"制裁が目標国の行動変容をもたらすかをめぐる論争。ハフバーラらは部分的成功を認める一方、ペイプは成功例は稀と批判。一般制裁の人道コストへの反省から、標的を絞ったスマート制裁や第三国企業に及ぶ二次制裁へ発展。事例：対ロシア制裁の効果論争。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ハフバーラら『Economic Sanctions Reconsidered』 vs ペイプ（1997年論争）", 年代:"1990年代〜", 事例:"", 既出:false },
  { 名前:"経済安全保障／エコノミック・ステイトクラフト", 説明:"経済的手段（制裁・輸出管理・投資規制等）を国家の戦略目的のために用いること、および経済的相互依存がもたらす脆弱性の管理。事例：半導体輸出管理、日本の経済安全保障推進法（2022年）、セキュリティ・クリアランス制度。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"デイヴィッド・ボールドウィン『Economic Statecraft』（1985年）", 年代:"1985年／2020年代に再興", 事例:"", 既出:false },
  { 名前:"脅威均衡論", 説明:"国家は国力そのものではなく「脅威」（総合国力・地理的近接性・攻撃能力・攻撃的意図）に対して均衡を図るとする理論。勢力均衡論の修正。事例：冷戦期に諸国がより強大な米国ではなくソ連に対抗して同盟を形成した。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"スティーヴン・ウォルト『同盟の起源』（1987年）", 年代:"1987年", 事例:"", 既出:false },
  { 名前:"自由主義的平和構築とその批判", 説明:"紛争後国家に民主主義と市場経済を移植する平和構築モデルと、性急な自由化が紛争再発を招くという批判（制度化を先行させるIBL論）。現地主体を重視するローカル・ターンへ展開。事例：カンボジア、東ティモール、アフガニスタンの失敗。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ローランド・パリス『At War's End』（2004年）", 年代:"2004年", 事例:"", 既出:false },
  { 名前:"自由貿易", 説明:"関税・数量制限など国境を越える取引への障壁を削減し、財・サービスの交換を市場原理に委ねる考え方。戦間期の保護貿易とブロック経済への反省から戦後貿易体制の柱になった。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"思想的起源はアダム・スミス『国富論』（1776年）とリカードの比較優位論（1817年）。制度化はGATT（1947年）", 年代:"1947年（GATT成立）", 事例:"", 既出:true },
  { 名前:"英国学派・国際社会論", 説明:"国家は共通の利益・価値・ルール・制度を通じて「国際社会」を形成するとする学派。秩序を重視する多元主義と、人権・正義のための介入を認める連帯主義の対立が軸。リアリズムとリベラリズムの中間の立場。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ヘドリー・ブル『国際社会論（The Anarchical Society）』（1977年）", 年代:"1977年", 事例:"", 既出:false },
  { 名前:"補完的保護経路（コミュニティ・スポンサーシップ）", 説明:"第三国定住を補完する合法的受入経路（家族呼寄せ・留学・労働ビザ・民間スポンサーシップ等）。特に市民グループが受入・定着支援を担うカナダの民間スポンサーシップ（PSR、1979年〜）が先駆例で、卒論テーマに直結。GCRも拡充を掲げる。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"カナダの民間スポンサーシップ制度（1979年〜）が先駆", 年代:"1979年〜", 事例:"", 既出:false },
  { 名前:"覇権安定論", 説明:"卓越した物質能力と意思を持つ覇権国が、開放市場・安定通貨・安全保障などの国際公共財を供給すると国際秩序が安定するという理論。キンドルバーガー、ギルピン、クラズナーらが発展させた。", 種別:"用語", 出自:"26", クラスタ:"", 提唱者:"キンドルバーガー『大不況下の世界』（1973年）。ギルピン、クラズナーが理論化", 年代:"1970年代", 事例:"", 既出:true },
  { 名前:"規範のコンテステーション（適用の争い／妥当性の争い）", 説明:"規範をめぐる異議申し立てを、規範の具体的適用方法を争うapplicatory contestationと、規範の正当性そのものを否定するvalidity contestationに区別。前者は規範を強化しうるが後者は侵食するとされる。卒論・研究計画の核となる最重要概念。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ウィーナー；ダイテルホフ＆ツィマーマン（2019／2020年）", 年代:"2019／2020年", 事例:"", 既出:false },
  { 名前:"規範のライフサイクル", 説明:"国際規範は創発（規範起業家による）→カスケード（臨界点＝約三分の一の国家の受容後の連鎖的拡散）→内面化の三段階を経るとするモデル。規範研究の最重要枠組み。事例：対人地雷禁止規範の拡散。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"フィネモア＆シッキンク（1998年）", 年代:"1998年", 事例:"", 既出:false },
  { 名前:"規範の内面化", 説明:"規範が当然視（taken-for-granted）され、遵守が意識的な計算ではなく自動的・習慣的になる規範ライフサイクルの最終段階。事例：奴隷制禁止、女性参政権の自明化。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"フィネモア＆シッキンクのライフサイクル・モデル（1998年）", 年代:"1998年", 事例:"", 既出:false },
  { 名前:"規範の衰退・消滅", 説明:"確立された国際規範が違反の累積・正当化言説・制度的支えの崩壊によって弱体化・消滅する過程。パンケ＆ペーターソーンの衰退メカニズム分類、パーシー＆サンホルツの規範変化論、マキューンの拷問禁止規範後退分析が主要文献。卒論テーマに直結するため最精密に。事例：拷問禁止規範（9.11後）、難民保護規範の侵食。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"パンケ＆ペーターソーン（2012年）、パーシー＆サンホルツ（2022年）、マキューン（2009年）", 年代:"2009〜2022年", 事例:"", 既出:false },
  { 名前:"規範対抗者（antipreneurs）・対抗活動", 説明:"新規範の創発・拡散に抵抗し、現状の規範的秩序を防衛する主体（ブルームフィールド）。規範普及側だけでなく抵抗側のエージェンシーに注目する研究動向（ボブの保守派NGO研究も含む）。規範の衰退・コンテステーション研究と直結。事例：R2PやLGBT権利規範への組織的抵抗。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ブルームフィールド（2016年）、ボブ（2012年）", 年代:"2012／2016年", 事例:"", 既出:false },
  { 名前:"規範起業家", 説明:"新しい規範を構想し、組織プラットフォームを通じて国家に受容を働きかける主体（個人・NGO・国際機構）。規範ライフサイクルの第一段階を担う。事例：対人地雷禁止を推進したICBLとオタワ・プロセス（1997年）。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"フィネモア＆シッキンク（1998年）、ナデルマン（1990年）", 年代:"1990〜98年", 事例:"", 既出:false },
  { 名前:"責任分担・負担分担", 説明:"難民保護の費用と責任を国際社会で公平に分かち合うべきだとする原則。スーカーは難民保護を国際公共財と捉え、便益が非排除的なため各国がフリーライドし保護が過少供給になると分析。GCR（2018年）の中核目標。事例：途上国が難民の約75％を受け入れる非対称。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"スーカー（1998年、公共財分析）；難民グローバル・コンパクト（2018年）", 年代:"1998年／2018年", 事例:"", 既出:false },
  { 名前:"軍備管理と軍縮の区別", 説明:"軍縮は兵器の削減・廃絶を目指すのに対し、軍備管理は戦略的安定のために兵器の数・種類・配備を規制・透明化する。事例：INF条約失効（2019年）、New STARTの履行停止、軍備管理体制の崩壊。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"冷戦期の戦略兵器交渉（SALT・START）で制度化", 年代:"冷戦期〜", 事例:"", 既出:false },
  { 名前:"適切性の論理／結果の論理", 説明:"行為の動機づけをめぐる対比。結果の論理は費用便益計算に基づく合理的選択、適切性の論理は「自分のような主体はこの状況で何をすべきか」というアイデンティティ・規範に基づく行動。合理主義と構成主義の対比軸。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"マーチ＆オルセン（1989年）", 年代:"1989年", 事例:"", 既出:false },
  { 名前:"集合行為問題とフリーライダー", 説明:"公共財は非排除性を持つため、各行為者が負担を逃れて便益だけ得ようとし（フリーライダー）、公共財が過少供給になる問題。小集団ほど解決しやすい。事例：気候変動対策、NATOの防衛費分担問題。覇権安定論の基礎。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"マンサー・オルソン『集合行為論』（1965年）", 年代:"1965年", 事例:"", 既出:false },
  { 名前:"集団安全保障", 説明:"体制内のいずれかの国による侵略に対し、他の全加盟国が共同で対処すると約束することで侵略を抑止する仕組み。特定の敵を想定する同盟・勢力均衡と対比される。安保理拒否権による機能不全が課題。事例：国連憲章第7章、湾岸戦争の武力行使容認決議（1990年）、ウクライナ侵攻での安保理麻痺。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"国際連盟規約（1919年）→国連憲章第7章（1945年）", 年代:"1919年／1945年", 事例:"", 既出:false },
  { 名前:"難民レジーム・コンプレックス", 説明:"難民保護が難民条約・UNHCRだけでなく、人権法・人道法・移住ガバナンス・労働法など重複する複数制度に統治されている状態。国家によるフォーラム・ショッピングを許す一方、柔軟な保護拡張の回路にもなる。ベッツが難民分野に適用。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"アレクサンダー・ベッツ（2010年）", 年代:"2010年", 事例:"", 既出:false },
  { 名前:"鹿狩り（安心）ゲーム", 説明:"全員が協力すれば最大の利益（鹿）を得られるが、相手の協力への不信から小さな確実な利益（兎）に走りうるゲーム構造。裏切りの誘因ではなく信頼の欠如（保証問題）が協力失敗の原因。囚人のジレンマとの区別が重要。事例：安全保障のジレンマの一部類型、軍縮の相互検証。", 種別:"用語", 出自:"候補リスト", クラスタ:"", 提唱者:"ルソー『人間不平等起源論』の寓話に起源", 年代:"18世紀起源", 事例:"", 既出:false },
  { 名前:"EUのFTA・GSP人権条項", 説明:"貿易上の利益と人権遵守をリンクさせるコンディショナリティの代表例。重大な違反時には協定の停止や特恵の撤回が可能で、ミャンマー（1997）やカンボジア（EBA一部停止、2020）への適用例がある。合理主義的な「結果の論理」による人権改善メカニズムの実例として設問1(2)型の論述で使える。", 種別:"事例", 出自:"25", クラスタ:"", 提唱者:"EUは1995年以降、対外協定に人権を「本質的要素」とする条項を標準化。GSP規則に基づく特恵停止例あり", 年代:"1995〜", 事例:"", 既出:true },
  { 名前:"コソボ空爆（NATO）", 説明:"アルバニア系住民への迫害を止めるため、安保理授権なしに実施された人道的介入。合法性と正当性の乖離を浮き彫りにし、ICISS設置とR2P概念形成（2001）の直接の契機となった。R2P成立前の事例なので「R2Pの適用例」としては書かない（今回の減点ポイント）。適用例はリビア（2011）を使う。", 種別:"事例", 出自:"25", クラスタ:"", 提唱者:"NATOによるユーゴスラビア空爆（1999年3〜6月）。独立国際コソボ委員会報告（2000）が「違法だが正当」と評価", 年代:"1999", 事例:"", 既出:true },
  { 名前:"ヘルシンキ・プロセスと東欧の人権改善", 説明:"東側諸国は国境の現状承認と引き換えに人権条項を言葉の上で受け入れたが、これを言質として国内外の監視団体（モスクワ・ヘルシンキ・グループ、チャーター77）が政府を拘束し、体制転換の一因となった。口頭の譲歩が言質となり規範遵守に至るスパイラル・モデル（リッセほか1999）の代表例。「東欧の人権改善」と書くときはこの固有名詞＋年代を添える。", 種別:"事例", 出自:"25", クラスタ:"", 提唱者:"ヘルシンキ宣言（CSCE最終議定書、1975）第7原則", 年代:"1975〜1989", 事例:"", 既出:true },
  { 名前:"ホルムズ海峡", 説明:"ペルシャ湾とオマーン湾を結ぶ海上交通の要衝。世界の石油輸送に占める重要性が高く、封鎖や軍事的緊張がエネルギー供給と価格に大きな影響を与える。", 種別:"事例", 出自:"26", クラスタ:"", 提唱者:"タンカー戦争（イラン・イラク戦争、1980年代）で重要性が顕在化", 年代:"1980年代／2019年緊張", 事例:"", 既出:true },
  { 名前:"リビア介入", 説明:"カダフィ政権による文民攻撃に対し「文民保護に必要なあらゆる措置」を授権した、R2P第3の柱の初の本格適用例。介入が体制転換に発展したことでロシア・中国など新興国の不信を招き、シリア内戦での安保理麻痺の一因となった。R2Pの到達点と限界の両方を示す事例として使える。", 種別:"事例", 出自:"25", クラスタ:"", 提唱者:"安保理決議1973（2011）に基づくNATO主導の軍事介入", 年代:"2011", 事例:"", 既出:true },
  { 名前:"冷戦期の米ソ核抑止", 説明:"米国とソ連が第二撃能力を保持し、相手の報復による壊滅的損害を恐れて全面核戦争を回避した事例。相互核抑止と相互確証破壊の代表例。", 種別:"事例", 出自:"26", クラスタ:"", 提唱者:"キューバ危機（1962年）が相互抑止安定化の転機", 年代:"1945〜1991年", 事例:"", 既出:true },
  { 名前:"北朝鮮と英国の核兵器に対する脅威認識", 説明:"米国が英国の核兵器より北朝鮮の核兵器を強く脅威視する比較。物質的な核能力だけでなく、同盟・敵対関係やアイデンティティが脅威認識を構成することを示す。", 種別:"事例", 出自:"26", クラスタ:"", 提唱者:"ウェントの構成主義の応用例（友好国の核と敵の核は意味が異なる）", 年代:"2000年代以降", 事例:"", 既出:true },
  { 名前:"南アフリカのアパルトヘイト終結と国際的圧力", 説明:"国際的な非難・経済制裁・スポーツボイコットと国内運動の連携がアパルトヘイト体制を段階的に追い込み、関連法撤廃（1991）と民主化（1994）に至った。物質的圧力（制裁）と規範的圧力（シェイミング）の複合が機能した事例で、スパイラル・モデルの代表例かつ制裁の有効性論争の題材にもなる。", 種別:"事例", 出自:"25", クラスタ:"", 提唱者:"国連総会非難決議、安保理武器禁輸（決議418、1977）、1980年代の包括的制裁を経て1994年全人種選挙", 年代:"1948〜1994", 事例:"", 既出:true },
  { 名前:"戦間期のブロック経済", 説明:"1930年代、英帝国特恵関税圏など各国が排他的な経済圏を形成し、保護貿易を強めた事例。世界貿易の縮小と国家間対立の激化を通じ、戦後の自由貿易体制形成の反省材料となった。", 種別:"事例", 出自:"26", クラスタ:"", 提唱者:"オタワ会議（1932年）で英帝国特恵関税圏が成立", 年代:"1930年代", 事例:"", 既出:true },
  { 名前:"新疆ウイグル自治区の人権問題", 説明:"大規模収容・強制労働等が国際的批判の対象となる一方、中国は内政問題と主張して調査・介入を拒否。人権保障の一義的責任が国家にあることの帰結（国家自身が侵害主体の場合に救済が働かない）と内政不干渉原則の緊張を示す現代事例。米欧は制裁や米国のウイグル強制労働防止法（2021）で対応するが、間接手段にとどまる。", 種別:"事例", 出自:"25", クラスタ:"", 提唱者:"国連人権高等弁務官事務所報告書（2022）が「人道に対する罪に当たりうる」と指摘", 年代:"2017〜", 事例:"", 既出:true },
  { 名前:"英独建艦競争", 説明:"ドイツの艦隊増強を英国が現状変更の脅威と受け取り、ドレッドノート建造競争に発展。防御的意図の下の軍拡が相互不信と対抗軍拡を招く安全保障のジレンマの古典例で、第一次世界大戦前の緊張激化の一因。「第一次大戦前のヨーロッパ」と書くより、この事象名＋年代で書くと事例点が取れる。", 種別:"事例", 出自:"25", クラスタ:"", 提唱者:"独艦隊法（1898・1900）を契機とする英独の海軍軍拡競争", 年代:"1898〜1912", 事例:"", 既出:true },
];

// ═══════════════════════════════════════════════════
const EXAM_DATE = new Date("2026-09-15T09:00:00+09:00");
const PROF_LEVELS = ["苦手", "うろ覚え", "ほぼ覚えた", "覚えた"];
const KEY_PROF = "yougo-prof-v1";
const KEY_ANS = "yougo-answers-v1";
const KEY_MOCK = "yougo-mock-v1";

let prof = load(KEY_PROF, {});
let savedAnswers = load(KEY_ANS, {});
let mockHistory = load(KEY_MOCK, []);

let filters = { kind: "すべて", source: "すべて", cluster: "すべて", prof: "すべて", hideAsked: false };
let view = "rotate";
let rotOrder = [], rotIdx = 0, revealed = false, rotStart = null;
let mock = null;

function load(k, fallback) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function profOf(t) { return prof[t.名前] || "苦手"; }
// 二重引用符のHTML属性の中の、単一引用符で囲んだJS文字列に安全に埋め込む
function jsAttr(s) {
  return esc(String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
}

// ─── 絞り込み ───────────────────────────────────────
function filtered() {
  return TERMS.filter(t => {
    if (!t.名前) return false;
    if (filters.kind !== "すべて" && t.種別 !== filters.kind) return false;
    if (filters.source !== "すべて" && t.出自 !== filters.source) return false;
    if (filters.cluster !== "すべて" && t.クラスタ !== filters.cluster) return false;
    if (filters.prof !== "すべて" && profOf(t) !== filters.prof) return false;
    if (filters.hideAsked && t.既出) return false;
    return true;
  });
}
function uniq(list) { return [...new Set(list.filter(Boolean))]; }

// ─── ヘッダー ───────────────────────────────────────
function renderHeader() {
  const n = TERMS.filter(t => t.名前).length;
  const nt = TERMS.filter(t => t.種別 === "用語").length;
  document.getElementById("header-sub").textContent = `用語${nt}・事例${n - nt}｜同期 ${SYNCED_AT}`;
  const days = Math.ceil((EXAM_DATE - new Date()) / 86400000);
  const strip = document.getElementById("exam-strip");
  strip.textContent = days > 0
    ? `専門科目 9/15（火）9:00 まで あと ${days} 日　—　設問2は 定義2〜3文 ＋ 提唱者/起源 ＋ 事例1、約9分/語`
    : `設問2の型：定義2〜3文 ＋ 提唱者/起源 ＋ 事例1`;
}

// ─── 画面切替 ───────────────────────────────────────
function switchView(v) {
  view = v;
  document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
  document.getElementById("view-" + v).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.view === v));
  window.scrollTo(0, 0);
  if (v === "rotate") renderRotate();
  if (v === "mock") renderMock();
  if (v === "list") { renderStats(); renderList(); }
}

// ═══ 回転 ═══════════════════════════════════════════
function buildRotOrder(shuffle) {
  const pool = filtered();
  const weight = { "苦手": 0, "うろ覚え": 1, "ほぼ覚えた": 2, "覚えた": 3 };
  rotOrder = pool.slice();
  if (shuffle) {
    for (let i = rotOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rotOrder[i], rotOrder[j]] = [rotOrder[j], rotOrder[i]];
    }
  }
  rotOrder.sort((a, b) => weight[profOf(a)] - weight[profOf(b)]);
  rotIdx = 0; revealed = false; rotStart = null;
}

function renderRotate() {
  if (!rotOrder.length) buildRotOrder(true);
  const el = document.getElementById("rot-card");
  if (!rotOrder.length) {
    el.innerHTML = `<div class="empty">条件に合うカードがありません。<br>絞り込みを変えるか、Notion側でカードを追加してください。</div>`;
    return;
  }
  if (rotIdx >= rotOrder.length) {
    el.innerHTML = `<div class="empty"><div style="font-size:32px;margin-bottom:8px">✓</div>
      ${rotOrder.length}枚を1周しました。<br><br>
      <button class="btn" onclick="buildRotOrder(true);renderRotate()">苦手優先でもう1周</button></div>`;
    return;
  }

  const t = rotOrder[rotIdx];
  const prev = savedAnswers[t.名前];
  if (!rotStart) rotStart = Date.now();

  el.innerHTML = `
    <div class="row">
      <div class="chips">
        <span class="tag kind-${esc(t.種別)}">${esc(t.種別)}</span>
        ${t.クラスタ ? `<span class="tag">${esc(t.クラスタ)}</span>` : ""}
        ${t.出自 ? `<span class="tag">出自 ${esc(t.出自)}</span>` : ""}
        ${t.既出 ? `<span class="tag asked">既出</span>` : ""}
      </div>
      <div class="rot-progress"><span id="rot-timer">0:00</span>　${rotIdx + 1} / ${rotOrder.length}</div>
    </div>

    <div class="term-name">${esc(t.名前)}</div>
    <div class="prompt-hint">${t.種別 === "事例"
      ? "この事例はどの理論・概念で説明できるか。事実関係（年・主体）→ 当てはめ の順で書く。"
      : "定義2〜3文 → 提唱者・起源 → 具体例1 の順で書く。"}</div>

    <textarea class="answer" id="rot-answer" placeholder="ここに手を動かして書く（見てから思い出すのではなく、書いてから答えを見る）" oninput="updateMeter()">${esc(prev || "")}</textarea>
    <div class="meter"><span id="rot-count">0字</span><span>目安 90〜150字</span></div>

    ${revealed ? renderAnswerPanel(t, prev) : `<button class="btn" style="margin-top:12px" onclick="reveal()">答えを見る</button>`}

    <div class="btn-row">
      <button class="btn ghost small" onclick="stepRot(-1)">← 前へ</button>
      <button class="btn ghost small" onclick="buildRotOrder(true);renderRotate()">シャッフル</button>
      <button class="btn ghost small" onclick="stepRot(1)">次へ →</button>
    </div>`;
  updateMeter();
}

function renderAnswerPanel(t, prev) {
  const cur = profOf(t);
  return `
    <div class="answer-panel">
      <div class="answer-label">模範解答（Notion の説明）</div>
      <div class="answer-body">${esc(t.説明) || '<span class="muted">説明が未記入です。Notion側で埋めてください。</span>'}</div>
      ${(t.提唱者 || t.年代) ? `<div class="answer-sub">提唱者・起源：<b>${esc(t.提唱者) || "—"}</b>${t.年代 ? `　／　年代：<b>${esc(t.年代)}</b>` : ""}</div>` : `<div class="answer-sub" style="color:var(--warn)">提唱者・起源が未記入。ルーブリックの2点分です。</div>`}
      ${t.事例 ? `<div class="answer-sub">紐づく事例：<b>${esc(t.事例)}</b></div>` : ""}
      ${prev ? `<div class="answer-sub" style="margin-top:12px">前回書いた答え</div><div class="prev-answer">${esc(prev)}</div>` : ""}
      <div class="grade-row">
        ${PROF_LEVELS.map((p, i) => `<button class="grade-btn g${i}" style="${cur === p ? "box-shadow:inset 0 0 0 2px currentColor" : ""}" onclick="grade('${p}')">${p}</button>`).join("")}
      </div>
    </div>`;
}

function reveal() {
  const t = rotOrder[rotIdx];
  const txt = document.getElementById("rot-answer").value.trim();
  if (txt) { savedAnswers[t.名前] = txt; save(KEY_ANS, savedAnswers); }
  revealed = true;
  renderRotate();
}

function grade(level) {
  const t = rotOrder[rotIdx];
  if (t) { prof[t.名前] = level; save(KEY_PROF, prof); }
  stepRot(1);
}

function stepRot(d) {
  const box = document.getElementById("rot-answer");
  if (box) {
    const t = rotOrder[rotIdx], txt = box.value.trim();
    if (txt) { savedAnswers[t.名前] = txt; save(KEY_ANS, savedAnswers); }
  }
  rotIdx = Math.max(0, rotIdx + d);
  revealed = false; rotStart = null;
  renderRotate();
}

function updateMeter() {
  const box = document.getElementById("rot-answer");
  const out = document.getElementById("rot-count");
  if (!box || !out) return;
  const n = box.value.replace(/\s/g, "").length;
  out.textContent = n + "字";
  out.className = n > 200 ? "over" : "";
}

// ═══ 模試（設問2） ══════════════════════════════════
function renderMock() {
  const el = document.getElementById("mock-area");
  if (!mock) { el.innerHTML = mockSetupHTML(); return; }
  if (!mock.submitted) { el.innerHTML = mockRunHTML(); return; }
  el.innerHTML = mockResultHTML();
}

function mockPool() {
  return filtered().filter(t => t.種別 === "用語" && t.説明);
}

function mockSetupHTML() {
  const pool = mockPool();
  const hist = mockHistory.slice(0, 5).map(h =>
    `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--border)">
       <span class="muted">${esc(h.date)}</span><b>${h.total} / 50</b></div>`).join("");
  return `
    <div class="card">
      <div style="font-weight:700;font-size:16px;margin-bottom:6px">設問2 模試</div>
      <div class="muted">8語を出題 → 5語を選択 → 45分。本番と同じ手順です。出題元は現在の絞り込み条件（用語のみ・説明ありのみ）で ${pool.length} 語。</div>
      ${pool.length < 8 ? `<div class="muted" style="color:var(--warn);margin-top:8px">8語に足りないため、${Math.min(pool.length, 8)}語で出題します。</div>` : ""}
      <button class="btn" style="margin-top:14px" onclick="startMock()" ${pool.length < 2 ? "disabled" : ""}>8語を出す</button>
    </div>
    ${mockHistory.length ? `<div class="card"><div style="font-weight:700;margin-bottom:6px">これまでの結果</div>${hist}</div>` : ""}`;
}

function startMock() {
  const pool = mockPool().slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  mock = { candidates: pool.slice(0, 8), picked: [], started: false, endsAt: null, answers: {}, scores: {}, submitted: false };
  renderMock();
}

function togglePick(idx) {
  const name = mock.candidates[idx].名前;
  const i = mock.picked.indexOf(name);
  if (i >= 0) mock.picked.splice(i, 1);
  else if (mock.picked.length < 5) mock.picked.push(name);
  renderMock();
}

function mockRunHTML() {
  if (!mock.started) {
    return `
      <div class="card">
        <div style="font-weight:700;font-size:16px;margin-bottom:4px">5語を選ぶ</div>
        <div class="muted" style="margin-bottom:12px">${mock.picked.length} / 5 語を選択</div>
        ${mock.candidates.map((t, i) => `
          <div class="pick-item ${mock.picked.includes(t.名前) ? "picked" : ""}" onclick="togglePick(${i})">
            <span class="num">${i + 1}</span>
            <div><div class="pick-name">${esc(t.名前)}</div>
            ${t.クラスタ ? `<span class="tag" style="margin-top:4px">${esc(t.クラスタ)}</span>` : ""}</div>
          </div>`).join("")}
        <button class="btn" style="margin-top:6px" onclick="beginTimer()" ${mock.picked.length === 0 ? "disabled" : ""}>45分で開始</button>
        <button class="btn ghost small" style="margin-top:8px" onclick="mock=null;renderMock()">やめる</button>
      </div>`;
  }
  const picked = mock.picked.map(n => TERMS.find(t => t.名前 === n));
  return `
    <div class="card">
      <div class="timer" id="mock-timer">45:00</div>
      <div class="muted" style="text-align:center">1語あたり約9分。書き終えたら提出。</div>
    </div>
    ${picked.map((t, i) => `
      <div class="card mock-q">
        <div class="q-head"><span class="q-no">(${i + 1})</span><span class="pick-name">${esc(t.名前)}</span></div>
        <textarea class="answer" data-name="${esc(t.名前)}" oninput="mock.answers[this.dataset.name]=this.value" placeholder="定義2〜3文 → 提唱者・起源 → 具体例1">${esc(mock.answers[t.名前] || "")}</textarea>
      </div>`).join("")}
    <button class="btn" onclick="submitMock()">提出して自己採点</button>`;
}

function beginTimer() {
  mock.started = true;
  mock.endsAt = Date.now() + 45 * 60 * 1000;
  renderMock();
}

function submitMock() {
  document.querySelectorAll("[data-name]").forEach(el => { mock.answers[el.dataset.name] = el.value; });
  mock.submitted = true;
  renderMock(); window.scrollTo(0, 0);
}

function mockResultHTML() {
  const picked = mock.picked.map(n => TERMS.find(t => t.名前 === n));
  const total = Object.values(mock.scores).reduce((a, b) => a + b, 0);
  const graded = Object.keys(mock.scores).length;
  return `
    <div class="card">
      <div class="total">${total} / ${picked.length * 10}</div>
      <div class="muted" style="text-align:center">${graded} / ${picked.length} 語を採点済み。6点以下の語は自動で「苦手」になります。</div>
      <div class="btn-row">
        <button class="btn ghost small" onclick="saveMock()">結果を保存して終了</button>
        <button class="btn ghost small" onclick="mock=null;renderMock()">保存せず終了</button>
      </div>
    </div>
    ${picked.map((t, i) => `
      <div class="card">
        <div class="q-head"><span class="q-no">(${i + 1})</span><span class="pick-name">${esc(t.名前)}</span></div>
        <div class="answer-label" style="margin-top:10px">自分の答案</div>
        <div class="prev-answer">${esc(mock.answers[t.名前] || "（未記入）")}</div>
        <div class="answer-label" style="margin-top:12px">模範解答</div>
        <div class="answer-body">${esc(t.説明)}</div>
        ${(t.提唱者 || t.年代) ? `<div class="answer-sub">提唱者・起源：<b>${esc(t.提唱者) || "—"}</b>${t.年代 ? `　／　年代：<b>${esc(t.年代)}</b>` : ""}</div>` : ""}
        ${t.事例 ? `<div class="answer-sub">紐づく事例：<b>${esc(t.事例)}</b></div>` : ""}
        <div class="score-row">
          ${[0, 4, 6, 8, 10].map(s =>
            `<button class="score-btn ${mock.scores[t.名前] === s ? "active" : ""}" onclick="setScore(${i},${s})">${s}</button>`).join("")}
        </div>
      </div>`).join("")}`;
}

function setScore(idx, s) {
  const name = mock.picked[idx];
  mock.scores[name] = s;
  if (s <= 6) { prof[name] = "苦手"; save(KEY_PROF, prof); }
  renderMock();
}

function saveMock() {
  const total = Object.values(mock.scores).reduce((a, b) => a + b, 0);
  mockHistory.unshift({
    date: new Date().toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }),
    total, terms: mock.picked.map(n => ({ 名前: n, score: mock.scores[n] ?? null }))
  });
  mockHistory = mockHistory.slice(0, 20);
  save(KEY_MOCK, mockHistory);
  mock = null; renderMock();
}

// ─── タイマー ───────────────────────────────────────
setInterval(() => {
  if (view === "rotate" && rotStart) {
    const el = document.getElementById("rot-timer");
    if (el) {
      const s = Math.floor((Date.now() - rotStart) / 1000);
      el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      el.style.color = s > 540 ? "var(--warn)" : "";
    }
  }
  if (view === "mock" && mock && mock.started && !mock.submitted) {
    const el = document.getElementById("mock-timer");
    if (el) {
      const left = Math.max(0, Math.floor((mock.endsAt - Date.now()) / 1000));
      el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
      el.classList.toggle("low", left < 300);
      if (left === 0) submitMock();
    }
  }
}, 500);

// ═══ 一覧・統計 ═════════════════════════════════════
function renderStats() {
  const pool = filtered();
  const el = document.getElementById("stats-card");
  const counts = {}; PROF_LEVELS.forEach(p => counts[p] = 0);
  pool.forEach(t => counts[profOf(t)]++);
  const max = Math.max(1, pool.length);

  const clusters = uniq(TERMS.map(t => t.クラスタ));
  let clusterHTML = "";
  if (clusters.length) {
    clusterHTML = `<div class="filter-label" style="margin:14px 0 8px">クラスタ別（目標 80語）</div>` +
      Object.keys(CLUSTER_TARGETS).concat(clusters.filter(c => !(c in CLUSTER_TARGETS))).map(c => {
        const n = TERMS.filter(t => t.クラスタ === c && t.種別 === "用語").length;
        const target = CLUSTER_TARGETS[c] || n || 1;
        return `<div class="stat-row"><div class="stat-label">${esc(c)}</div>
          <div class="stat-track"><div class="stat-fill" style="width:${Math.min(100, n / target * 100)}%"></div></div>
          <div class="stat-count">${n} / ${target}</div></div>`;
      }).join("");
  } else {
    clusterHTML = `<div class="muted" style="margin-top:12px">Notion に「クラスタ」プロパティ（安保／IPE／規範・理論）を足すと、80語の内訳がここに出ます。</div>`;
  }

  el.innerHTML = `
    <div class="row"><div style="font-weight:700">習熟度（表示中 ${pool.length} 枚）</div></div>
    <div style="margin-top:10px">
    ${PROF_LEVELS.map(p => `<div class="stat-row"><div class="stat-label">${p}</div>
      <div class="stat-track"><div class="stat-fill fill-${p}" style="width:${counts[p] / max * 100}%"></div></div>
      <div class="stat-count">${counts[p]}</div></div>`).join("")}
    </div>
    ${clusterHTML}
    ${(() => {
      const terms = TERMS.filter(t => t.種別 === "用語");
      const done = terms.filter(t => t.提唱者).length;
      return `<div class="filter-label" style="margin:14px 0 8px">提唱者・起源の記入</div>
        <div class="stat-row"><div class="stat-label">記入済み</div>
        <div class="stat-track"><div class="stat-fill" style="width:${terms.length ? done / terms.length * 100 : 0}%"></div></div>
        <div class="stat-count">${done} / ${terms.length}</div></div>`;
    })()}`;
}

function renderList() {
  const q = (document.getElementById("search").value || "").trim().toLowerCase();
  const pool = filtered().filter(t =>
    !q || t.名前.toLowerCase().includes(q) || (t.説明 || "").toLowerCase().includes(q));
  const el = document.getElementById("list-area");
  if (!pool.length) { el.innerHTML = `<div class="empty">該当なし</div>`; return; }
  el.innerHTML = pool.map((t, i) => `
    <div class="list-item" onclick="this.querySelector('.list-desc').classList.toggle('clamp')">
      <div class="row">
        <div class="list-name">${esc(t.名前)}</div>
        <span class="tag">${esc(profOf(t))}</span>
      </div>
      <div class="list-desc clamp">${esc(t.説明) || "（説明が未記入）"}</div>
    </div>`).join("");
}

// ═══ 絞り込みUI ═════════════════════════════════════
function chipHTML(id, values, current) {
  return ["すべて", ...values].map(v =>
    `<button class="chip ${current === v ? "active" : ""}" onclick="setFilter('${id}','${jsAttr(v)}')">${esc(v)}</button>`).join("");
}
function renderDrawer() {
  document.getElementById("f-kind").innerHTML = chipHTML("kind", uniq(TERMS.map(t => t.種別)), filters.kind);
  document.getElementById("f-source").innerHTML = chipHTML("source", uniq(TERMS.map(t => t.出自)), filters.source);
  const clusters = uniq(TERMS.map(t => t.クラスタ));
  document.getElementById("cluster-group").style.display = clusters.length ? "block" : "none";
  document.getElementById("f-cluster").innerHTML = chipHTML("cluster", clusters, filters.cluster);
  document.getElementById("f-prof").innerHTML = chipHTML("prof", PROF_LEVELS, filters.prof);
  const ab = document.getElementById("f-asked");
  ab.textContent = filters.hideAsked ? "除いている" : "除かない";
  ab.classList.toggle("active", filters.hideAsked);
}
function setFilter(id, v) { filters[id] = v; afterFilterChange(); }
function toggleAsked() { filters.hideAsked = !filters.hideAsked; afterFilterChange(); }
function afterFilterChange() {
  renderDrawer(); buildRotOrder(true);
  if (view === "rotate") renderRotate();
  if (view === "list") { renderStats(); renderList(); }
  if (view === "mock" && !mock) renderMock();
}
function openDrawer() { renderDrawer(); document.getElementById("drawer-overlay").classList.add("open"); }
function closeDrawer(e) { if (!e || e.target.id === "drawer-overlay") document.getElementById("drawer-overlay").classList.remove("open"); }

// ═══ バックアップ ═══════════════════════════════════
function exportProgress() {
  const blob = new Blob([JSON.stringify({ prof, savedAnswers, mockHistory }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `yougo-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}
function importProgress(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      prof = Object.assign({}, prof, d.prof || {});
      savedAnswers = Object.assign({}, savedAnswers, d.savedAnswers || {});
      if (Array.isArray(d.mockHistory)) mockHistory = d.mockHistory.concat(mockHistory).slice(0, 20);
      save(KEY_PROF, prof); save(KEY_ANS, savedAnswers); save(KEY_MOCK, mockHistory);
      afterFilterChange(); alert("読み込みました");
    } catch (e) { alert("ファイルを読めませんでした"); }
  };
  r.readAsText(file);
  ev.target.value = "";
}

// ═══ 起動 ═══════════════════════════════════════════
renderHeader();
buildRotOrder(true);
renderRotate();
renderDrawer();
</script>
</body>
</html>
